[tool.poetry]
name = "the2048"
version = "0.1.0"
description = "A 2048 puzzle game with a Monster Kitchen creative twist"
authors = ["Favur <favur@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pygame-ce = "^2.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pyinstaller = {version = "^6.21.0", python = ">=3.11,<3.16"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
